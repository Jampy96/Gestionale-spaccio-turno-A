<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spaccio Turno A - v28 Cloud</title>
<style>
:root{--blue:#1769aa;--blue2:#0d47a1;--bg:#f4f7fb;--card:#fff;--text:#1e293b;--muted:#64748b;--line:#dbe3ee;--ok:#15803d}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:18px}
header h1{margin:0;font-size:1.35rem}.wrap{max-width:980px;margin:auto;padding:18px}
.screen{min-height:calc(100vh - 75px);display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 4px 18px #0000000d}
.auth{width:min(430px,100%)} h2{margin-top:0}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;font-size:1rem;margin:7px 0 13px}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font-size:1rem}
button:hover{background:var(--blue2)}button.secondary{background:#e8f1fb;color:var(--blue2)}button.big{width:100%;padding:16px;font-size:1.15rem}
.role-grid,.home-grid,.cat-grid,.products{display:grid;gap:12px}.role-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.home-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.cat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.products{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile{min-height:90px}.balance-blue{background:#1976d2!important;color:#fff!important}.balance-blue:hover{background:#0d47a1!important}.product{background:#fff;border:1px solid var(--line);color:var(--text);text-align:left}.product small{display:block;color:var(--muted);margin-top:5px}
.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.badge{background:#e8f1fb;color:var(--blue2);padding:6px 10px;border-radius:20px;font-weight:700}
.cart-row,.order-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.total{font-size:1.35rem;font-weight:800;margin:15px 0}.muted{color:var(--muted)}
.hidden{display:none!important}.bar-order{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px;background:#fff}
.status{display:inline-block;padding:5px 9px;border-radius:15px;background:#eef2f7;color:#475569;font-weight:700}
.status.ok{background:#dcfce7;color:var(--ok)}
.notice{padding:10px;background:#eef6ff;border-radius:9px;margin-bottom:12px}
.pay-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.pay-btn{min-height:54px;font-size:1rem}.pay-btn:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:700px){.home-grid,.cat-grid,.role-grid{grid-template-columns:1fr}.wrap{padding:12px}}
.account-block{margin-top:14px}.balance-positive{color:#15803d}.balance-negative{color:#b91c1c}.account-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.account-actions button:last-child{grid-column:1/-1}@media(max-width:650px){.account-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
  <h1>☕ Spaccio Turno A</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span id="cloudStatus" class="badge" style="background:#fff;color:#475569">⚪ Connessione...</span>
    <button type="button" class="secondary" style="background:#fff;color:#0d47a1" onclick="manualSaveData()">SALVA DATI</button>
    <button type="button" class="secondary" style="background:#fff;color:#0d47a1" onclick="exportJSON()">ESPORTA JSON</button>
    <button type="button" class="secondary" style="background:#fff;color:#0d47a1" onclick="document.getElementById('importJSONFile').click()">IMPORTA JSON</button>
    <input id="importJSONFile" type="file" accept="application/json,.json" style="display:none" onchange="importJSON(event)">
  </div>
</header>

<section id="loginScreen" class="screen">
<div class="card auth">
<h2>Login</h2>
<label>Username</label><input id="username" autocomplete="username">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button class="big" onclick="login()">ACCEDI</button>
<p id="loginError" class="muted"></p>
</div>
</section>

<section id="roleScreen" class="screen hidden">
<div class="card auth">
<h2>Scegli il ruolo</h2>
<div id="roleButtons" class="role-grid"></div><button class="secondary" style="width:100%;margin-top:14px" onclick="logout()">ESCI</button>
</div>
</section>

<section id="firstPasswordScreen" class="screen hidden">
<div class="card auth">
<h2>Primo accesso</h2>
<p>Per motivi di sicurezza devi cambiare la password prima di continuare.</p>
<label>Nuova password</label><input id="firstNewPassword" type="password" autocomplete="new-password" placeholder="Inserisci una nuova password">
<label>Conferma nuova password</label><input id="firstConfirmPassword" type="password" autocomplete="new-password" placeholder="Ripeti la nuova password">
<button class="big" onclick="completeFirstPasswordChange()">CAMBIA PASSWORD E CONTINUA</button>
<p id="firstPasswordError" class="muted"></p>
</div>
</section>

<main id="app" class="wrap hidden"></main>

<script>
const defaultEmployees = ["Berardi Andrea", "Bonesso Riccardo", "Brandoli Francesco", "Campedel Ramiro", "Capuano Eduardo", "Carrozza Paolo", "Casapinta Davide", "Catarci Leonardo", "Cervellati Federico", "Collesei Marco", "De Bari Daniele", "De Bellis Pasquale", "Favaro Alvise", "Fedrigo Andrea", "Grandelis Alessandro", "Mion Alessandro", "Musiu Gianluca", "Muratore Giampaolo", "Niero Simone", "Nordio Eros", "Paolone Michele", "Pelati Massimo", "Poletto Emanuele", "Puppa Luca", "Righetto Giacomo", "Rubin Marco", "Scaldelai Roberto", "Semenzato Daniele", "Sibilia Gianluca", "Stante Gabriele", "Zanin Umberto"];
let employees=(JSON.parse(localStorage.getItem("spaccio_employees_v1")||"null")||defaultEmployees.slice()).sort((a,b)=>a.localeCompare(b,"it",{sensitivity:"base"}));
let products = [{"cat": "Caffetteria", "name": "Caffè / Macchiato", "price": 0.6}, {"cat": "Caffetteria", "name": "Macchiatone", "price": 0.7}, {"cat": "Caffetteria", "name": "Cappuccino", "price": 0.8}, {"cat": "Caffetteria", "name": "Orzo / Deca", "price": 0.6}, {"cat": "Caffetteria", "name": "Latte macchiato", "price": 0.8}, {"cat": "Caffetteria", "name": "Latte", "price": 0.6}, {"cat": "Bibite", "name": "Bibita lattina", "price": 1.0}, {"cat": "Bibite", "name": "Succo di frutta", "price": 0.6}, {"cat": "Bibite", "name": "Tè in bottiglia", "price": 1.0}, {"cat": "Bibite", "name": "Acqua ½ lt", "price": 0.5}, {"cat": "Merendine e snack", "name": "Brioches fresche", "price": 1.0}, {"cat": "Merendine e snack", "name": "Merendine confezionate", "price": 0.6}, {"cat": "Merendine e snack", "name": "Gelati", "price": 1.0}, {"cat": "Merendine e snack", "name": "Patatine / snack salati", "price": 0.6}];
const defaultCredentials = {
  "Niero Simone": ["dipendente", "Spaccio123A"]
};
// Da questa versione solo Niero Simone mantiene un account dipendente.
// Tutte le altre credenziali dipendenti precedenti vengono eliminate dal browser.
const storedCredentials=JSON.parse(localStorage.getItem("spaccio_credentials_v1")||"{}");
let credentials={"Niero Simone":Array.isArray(storedCredentials["Niero Simone"])?storedCredentials["Niero Simone"]:["dipendente","Spaccio123A"]};
localStorage.setItem("spaccio_credentials_v1",JSON.stringify(credentials));
function usernameFromName(name){const parts=name.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/\s+/).filter(Boolean); return parts.length>=2 ? parts[parts.length-1]+"."+parts.slice(0,-1).join(".") : (parts[0]||"");}
const FIRST_ACCESS_KEY="spaccio_first_access_v1";
let firstAccess={"Niero Simone":true};
localStorage.setItem(FIRST_ACCESS_KEY,JSON.stringify(firstAccess));
function saveFirstAccess(){localStorage.setItem(FIRST_ACCESS_KEY,JSON.stringify(firstAccess));}
function mustChangePassword(){return false;}

let accounts = { admin:{password:"admin"} };
function rebuildAccounts(){ accounts={admin:{password:"admin"}}; Object.entries(credentials).forEach(([employee,[username,password]])=>{ accounts[username]={password,employee}; }); }
rebuildAccounts();
let user=null, role=null;
let cart=[];
let editingOrderId=null;
let orders=JSON.parse(localStorage.getItem("spaccio_orders_v1")||"[]");
let nextId=Number(localStorage.getItem("spaccio_next_id_v1")||"1");
const DAILY_ORDER_KEY="spaccio_daily_order_v1";
function localDateKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`;}
function localDateTime(iso){const d=new Date(iso);return d.toLocaleDateString("it-IT")+" · "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});}
function nextDailyOrderNumber(){const today=localDateKey();let state=JSON.parse(localStorage.getItem(DAILY_ORDER_KEY)||"null");if(!state||state.date!==today)state={date:today,last:0};state.last++;localStorage.setItem(DAILY_ORDER_KEY,JSON.stringify(state));return state.last;}
function orderAccount(o){return o.createdByUsername||o.createdBy||"—";}
let balances=JSON.parse(localStorage.getItem("spaccio_balances_v1")||"{}");
let fondocassa=Number(localStorage.getItem("spaccio_fondocassa_v1"));
let cassaforte=Number(localStorage.getItem("spaccio_cassaforte_v1"));
let mealMovements=JSON.parse(localStorage.getItem("spaccio_meal_movements_v1")||"[]");

// V19: nuova partenza pulita. Eseguito una sola volta per il nuovo file.
if(localStorage.getItem("spaccio_clean_start_v3")!=="1"){
  orders=[];
  nextId=1;
  balances={};
  employees.forEach(n=>balances[n]=0);
  mealMovements=[];
  fondocassa=100;
  localStorage.setItem("spaccio_orders_v1",JSON.stringify(orders));
  localStorage.setItem("spaccio_next_id_v1",String(nextId));
  localStorage.setItem("spaccio_balances_v1",JSON.stringify(balances));
  localStorage.setItem("spaccio_meal_movements_v1",JSON.stringify(mealMovements));
  localStorage.setItem("spaccio_fondocassa_v1","100");
  localStorage.setItem("spaccio_clean_start_v3","1");
}
// Tutti i dipendenti, tranne Niero Simone, devono effettuare il primo accesso.
employees.forEach(n=>{firstAccess[n]=(n==="Niero Simone");});
saveFirstAccess();
const stockItems=["CAFFE","ORZO","DECA","LATTE","COCA","TÈ","ACQUA","MERENDINE","GELATI","SNACK SALATI"];
let stock=JSON.parse(localStorage.getItem("spaccio_stock_v1")||"null")||{};
stockItems.forEach(n=>{if(typeof stock[n]!=="number") stock[n]=0});
Object.keys(stock).forEach(n=>{if(!stockItems.includes(n)) delete stock[n]});
if(!Number.isFinite(fondocassa)){ fondocassa=100; localStorage.setItem("spaccio_fondocassa_v1",String(fondocassa)); }
if(!Number.isFinite(cassaforte)){ cassaforte=0; localStorage.setItem("spaccio_cassaforte_v1",String(cassaforte)); }
if(localStorage.getItem("spaccio_balances_reset_v2")!=="1"){
  balances={}; employees.forEach(n=>balances[n]=0);
  localStorage.setItem("spaccio_balances_v1",JSON.stringify(balances));
  localStorage.setItem("spaccio_balances_reset_v2","1");
}else{ employees.forEach(n=>{if(typeof balances[n]!=="number") balances[n]=0}); }

function euro(n){return "€ "+Number(n).toFixed(2).replace(".",",")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){
  localStorage.setItem("spaccio_orders_v1",JSON.stringify(orders));
  localStorage.setItem("spaccio_next_id_v1",String(nextId));
  localStorage.setItem("spaccio_balances_v1",JSON.stringify(balances));
  localStorage.setItem("spaccio_fondocassa_v1",String(fondocassa));
  localStorage.setItem("spaccio_employees_v1",JSON.stringify(employees));
  localStorage.setItem("spaccio_credentials_v1",JSON.stringify(credentials));
  localStorage.setItem("spaccio_stock_v1",JSON.stringify(stock));
  localStorage.setItem("spaccio_cassaforte_v1",String(cassaforte));
  localStorage.setItem("spaccio_meal_movements_v1",JSON.stringify(mealMovements));
  localStorage.setItem(FIRST_ACCESS_KEY,JSON.stringify(firstAccess));
}
async function manualSaveData(){
  try{
    save();
    if(window.firebaseSaveData){
      await window.firebaseSaveData(collectAllData());
      alert("SALVATAGGIO COMPLETATO: dati salvati su questo browser e su Firebase Firestore.");
    }else{
      alert("Dati salvati in locale. Firebase non è ancora connesso: riprova tra qualche secondo.");
    }
  }catch(error){
    console.error("Errore nel salvataggio:",error);
    alert("ERRORE DI SALVATAGGIO: "+(error?.message||error)+". Verifica connessione e regole Firestore.");
  }
}
function collectAllData(){
  return {
    version:28, employees, products, credentials, firstAccess, orders, nextId, balances,
    fondocassa, cassaforte, mealMovements, stock,
    dailyOrderState:localStorage.getItem(DAILY_ORDER_KEY),
    cleanStart:localStorage.getItem("spaccio_clean_start_v3"),
    balancesReset:localStorage.getItem("spaccio_balances_reset_v2")
  };
}
function applyAllData(data){
  if(!data || typeof data!=="object") throw new Error("Il JSON non contiene dati validi.");
  if(Array.isArray(data.employees)) employees=data.employees.filter(x=>typeof x==="string").sort((a,b)=>a.localeCompare(b,"it",{sensitivity:"base"}));
  if(Array.isArray(data.orders)) orders=data.orders;
  if(Array.isArray(data.products)) products=data.products;
  if(Number.isFinite(Number(data.nextId))) nextId=Number(data.nextId);
  if(data.balances && typeof data.balances==="object") balances=data.balances;
  if(Number.isFinite(Number(data.fondocassa))) fondocassa=Number(data.fondocassa);
  if(Number.isFinite(Number(data.cassaforte))) cassaforte=Number(data.cassaforte);
  if(Array.isArray(data.mealMovements)) mealMovements=data.mealMovements;
  if(data.stock && typeof data.stock==="object") stock=data.stock;
  if(data.credentials && typeof data.credentials==="object") credentials=data.credentials;
  if(data.firstAccess && typeof data.firstAccess==="object") firstAccess=data.firstAccess;
  stockItems.forEach(n=>{if(typeof stock[n]!=="number")stock[n]=0});
  Object.keys(stock).forEach(n=>{if(!stockItems.includes(n))delete stock[n]});
  employees.forEach(n=>{if(typeof balances[n]!=="number")balances[n]=0});
  rebuildAccounts();
  if(data.dailyOrderState) localStorage.setItem(DAILY_ORDER_KEY,data.dailyOrderState);
  save();
  if(role) renderHome();
}
function exportJSON(){
  try{
    save();
    const blob=new Blob([JSON.stringify(collectAllData(),null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="spaccio-turno-a-backup-"+localDateKey()+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }catch(error){alert("Esportazione non riuscita: "+(error?.message||error));}
}
async function importJSON(event){
  const file=event.target.files?.[0]; if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!confirm("Importare questo backup? I dati attuali verranno sostituiti e sincronizzati su Firestore."))return;
    applyAllData(data);
    if(!window.firebaseSaveData) throw new Error("Firebase non è ancora connesso.");
    await window.firebaseSaveData(collectAllData());
    alert("Backup importato e sincronizzato correttamente.");
  }catch(error){console.error(error);alert("Importazione non riuscita: "+(error?.message||error));}
  finally{event.target.value="";}
}
// Salvataggio automatico ogni 5 secondi per tutta la permanenza dell'app aperta.
// Il salvataggio immediato su cambio scheda/chiusura riduce il rischio di perdere gli ultimi dati.
let autosaveLastError = "";
function autosave(){
  try{
    save();
    autosaveLastError = "";
    return true;
  }catch(error){
    autosaveLastError = String(error && error.message ? error.message : error);
    console.error("Errore nel salvataggio automatico di Spaccio Turno A:", error);
    return false;
  }
}
// Salvataggio immediato appena tutti i dati sono stati caricati.
autosave();
const autosaveTimer = setInterval(autosave, 5000);
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState === "hidden") autosave();
});
window.addEventListener("pagehide",autosave);
window.addEventListener("beforeunload",autosave);

const privilegedEmployees = new Set([
  "Niero Simone",
  "Casapinta Davide",
  "Favaro Alvise",
  "Mion Alessandro",
  "Musiu Gianluca",
  "Muratore Giampaolo",
  "Poletto Emanuele",
  "Scaldelai Roberto"
]);
function renderRoleChoice(){
  const box=document.getElementById("roleButtons");
  const canManage = !user.employee || privilegedEmployees.has(user.employee);
  box.innerHTML = canManage
    ? `<button class="tile" onclick="selectRole('Amministratore')">Amministratore</button><button class="tile" onclick="selectRole('Cassiere')">Cassiere</button>`
    : `<p class="muted">Nessun ruolo disponibile.</p>`;
}
function login(){
  const u=document.getElementById("username").value.trim().toLowerCase(), p=document.getElementById("password").value;
  if(!accounts[u] || accounts[u].password!==p){document.getElementById("loginError").textContent="Username o password non validi.";return}
  user={username:u,employee:accounts[u].employee||null};
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("roleScreen").classList.remove("hidden");
  renderRoleChoice();
}
function completeFirstPasswordChange(){
  const a=document.getElementById("firstNewPassword")?.value||"", b=document.getElementById("firstConfirmPassword")?.value||"";
  const err=document.getElementById("firstPasswordError");
  if(a.length<4){err.textContent="La password deve contenere almeno 4 caratteri.";return}
  if(a!==b){err.textContent="Le password non coincidono.";return}
  if(!user?.employee || !credentials[user.employee]){err.textContent="Account dipendente non disponibile.";return}
  credentials[user.employee]=[credentials[user.employee][0],a];
  firstAccess[user.employee]=true;
  rebuildAccounts(); save(); saveFirstAccess();
  document.getElementById("firstPasswordScreen").classList.add("hidden");
  document.getElementById("roleScreen").classList.remove("hidden");
  renderRoleChoice();
}

function logout(){
  user=null; role=null; cart=[];
  document.getElementById("app").innerHTML="";
  document.getElementById("app").classList.add("hidden");
  document.getElementById("roleScreen").classList.add("hidden");
  document.getElementById("firstPasswordScreen").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("username").value="";
  document.getElementById("password").value="";
  document.getElementById("loginError").textContent="";
}
function selectRole(r){
  const canManage = !user?.employee || privilegedEmployees.has(user.employee);
  if((r==="Amministratore"||r==="Cassiere") && !canManage){
    alert("Questo account può accedere solamente al ruolo Dipendente.");
    renderRoleChoice();
    return;
  }
  role=r;
  if(r==="Amministratore"){
    const extra=prompt("Password aggiuntiva amministratore:");
    if(extra!=="SpaccioA"){alert("Password amministratore non corretta.");return}
  }
  document.getElementById("roleScreen").classList.add("hidden");
  renderHome();
}
function renderHome(){
  const app=document.getElementById("app");app.classList.remove("hidden");
  if(role==="Cassiere") cashierHome();
  else if(role==="Dipendente") employeeHome();
  else adminHome();
}
function backToRoleChoice(){
  role=null;
  cart=[];
  document.getElementById("app").innerHTML="";
  document.getElementById("app").classList.add("hidden");
  document.getElementById("roleScreen").classList.remove("hidden");
}
function shell(title,content){
  document.getElementById("app").innerHTML=`<div class="topbar"><div><h2>${title}</h2><span class="badge">${role}</span></div><button class="secondary" onclick="backToRoleChoice()">CAMBIA RUOLO</button></div>${content}`;
}
function cashierHome(){
  shell("Cassiere Home",`<div class="notice"><b>Fondocassa</b><div style="font-size:1.8rem;font-weight:800;margin-top:6px">${euro(fondocassa)}</div><div class="muted">Importo iniziale disponibile in cassa</div></div><div class="home-grid">
    <button class="tile" onclick="newOrder()">Nuovo Ordine</button>
    <button class="tile" onclick="historyView()">Storico</button>
    <button class="tile balance-blue" onclick="employeeBalancesView()">SALDO DIPENDENTI</button>
  </div>`);
}
function newOrder(editId=null){
  editingOrderId=editId;
  cart=[];
  if(editId!==null){
    const existing=orders.find(o=>o.id===editId);
    if(!existing){alert("Ordine non trovato.");return;}
    cart=existing.items.map(x=>({...x}));
  }
  const existingOrder=editId!==null?orders.find(o=>o.id===editId):null;
  shell(editId!==null?`Modifica Ordine #${existingOrder.number}`:"Nuovo Ordine",`<div class="card">
    <h3>1. Tipo cliente</h3>
    <select id="customerType" onchange="customerChanged()"><option value="">Seleziona...</option><option value="employee">Dipendente</option><option value="external">Cliente esterno</option></select>
    <div id="customerBox"></div>
    <div id="productsBox"></div>
    <div id="cartBox"></div>
  </div><button class="secondary" style="margin-top:14px" onclick="cancelNewOrder()">← TORNA AL MENU</button>`);
  if(existingOrder){document.getElementById("customerType").value=existingOrder.customerType;customerChanged();}
}
function cancelNewOrder(){
  cart=[];
  editingOrderId=null;
  cashierHome();
}
function customerChanged(){
  const t=document.getElementById("customerType").value, box=document.getElementById("customerBox");
  const existing=editingOrderId!==null?orders.find(o=>o.id===editingOrderId):null;
  if(t==="employee"){
    let opts=employees.slice().sort((a,b)=>a.localeCompare(b,"it",{sensitivity:"base"})).map(n=>`<option ${((existing&&existing.customer===n)||(!existing&&user.employee===n))?"selected":""}>${esc(n)}</option>`).join("");
    box.innerHTML=`<label>Dipendente</label><select id="customerName" onchange="renderProducts();refreshAccountBalance()">${opts}</select>`;
  } else if(t==="external"){
    box.innerHTML=`<label>Nome cliente (facoltativo)</label><input id="customerName" placeholder="Cliente esterno" value="${existing?esc(existing.customer):""}">`;
  } else box.innerHTML="";
  renderProducts();
}
function refreshAccountBalance(){
  const box=document.getElementById("customerBox");
  const name=document.getElementById("customerName")?.value;
  if(!box || !name) return;
  let info=document.getElementById("customerBalanceInfo");
  if(!info){
    info=document.createElement("div");
    info.id="customerBalanceInfo";
    info.className="muted";
    info.style.margin="4px 0 10px";
    box.appendChild(info);
  }
  const value=Number(balances[name]||0);

function confirmOrder(mode){

  if(mode!=="subito" && mode!=="conto"){alert("PAGA DOPO non è più disponibile.");return}
  if(editingOrderId!==null){

    const o=orders.find(x=>x.id===editingOrderId);
    if(!o){alert("Ordine non trovato.");return}

    if(cash<total){alert("Il contante ricevuto è insufficiente.");return}
    const type=document.getElementById("customerType").value, name=document.getElementById("customerName")?.value||"Cliente esterno";
    const oldTotal=Number(o.total||0);
    o.customerType=type;o.customer=name;o.items=cart.map(x=>({...x}));o.total=total;o.cash=cash;o.change=cash-total;o.paid=true;o.payment="subito";o.status="Completato";o.paidAt=new Date().toISOString();
    fondocassa += (total-oldTotal);editingOrderId=null;save();alert("Ordine #"+o.number+" modificato e pagato subito.");cashierHome();return;
  }
  const type=document.getElementById("customerType").value, name=document.getElementById("customerName")?.value||"Cliente esterno";
  let paid=false,cash=null,change=null,paymentLabel="";
  if(mode==="subito"){
    cash=Number(document.getElementById("cash")?.value||0);
    if(cash<total){alert("Il contante ricevuto è insufficiente.");return}
    paid=true;change=cash-total;paymentLabel="Pagato subito";
    // Il fondocassa aumenta del valore effettivamente incassato dalla vendita.
    fondocassa+=total;
  }else if(mode==="conto"){
    if(type!=="employee"){alert("METTI IN CONTO è disponibile solo per un dipendente.");return}
    balances[name]=(balances[name]||0)-total;
    paid=true;
    paymentLabel="Messo in conto";
  }
  const now=new Date().toISOString();
  const order={id:nextId++,date:now,dateKey:localDateKey(new Date()),number:nextDailyOrderNumber(),customerType:type,customer:name,items:cart.map(x=>({...x})),total,cash,change,paid,payment:mode,status:"Completato",createdByUsername:user?.username||"—",createdByEmployee:user?.employee||"—",createdByRole:role||"Cassiere"};
  orders.push(order);save();alert("Ordine #"+order.number+" registrato: "+paymentLabel+".");cashierHome();
}

function applyEmployeeBalanceChange(name,delta){
  const oldBalance=Number(balances[name]||0);
  const newBalance=oldBalance+delta;
  // Saldo negativo = debito: una variazione positiva incassa denaro fino a chiudere il debito.
  if(oldBalance<0 && delta>0){
    fondocassa += delta;
  }
  // Saldo positivo = credito: una variazione negativa può rappresentare un rimborso in contanti.
  if(oldBalance>0 && delta<0){
    fondocassa += delta;
  }
  balances[name]=newBalance;
  save();
}

function mealTurnoView(){

function confirmMealTurno(){
  const selected=[...document.querySelectorAll('.mealEmployeeCheck:checked')].map(x=>x.value), amount=Number(document.getElementById('mealAmount')?.value||0);
  if(!selected.length){alert('Seleziona almeno un dipendente.');return} if(!Number.isFinite(amount)||amount<=0){alert('Inserisci un importo valido.');return}
  const total=selected.length*amount; if(!confirm('Confermare '+euro(amount)+' per ciascuno dei '+selected.length+' dipendenti selezionati? Totale: '+euro(total)))return;
  const now=new Date().toISOString(); selected.forEach(name=>{balances[name]=(balances[name]||0)-amount; mealMovements.push({id:Date.now()+Math.random(),date:now,employee:name,amount,type:'Pranzo/Cena con il turno'});});
  save(); alert('Pranzo/cena registrato. Totale addebitato: '+euro(total)+'.'); adminHome();
}

}
function saveStock(){

<script>
// Ponte tra il gestionale esistente e il modulo Firebase.
window.spaccioCollectAllData = collectAllData;
window.spaccioApplyAllData = applyAllData;
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBxPFBq-YKSu-je6RBRqudyei7-EsjWm4Y",
  authDomain: "spaccio-turno-a.firebaseapp.com",
  projectId: "spaccio-turno-a",
  storageBucket: "spaccio-turno-a.firebasestorage.app",
  messagingSenderId: "43990223549",
  appId: "1:43990223549:web:1b5c14b90178451da645d4"
};
const statusEl=document.getElementById("cloudStatus");
function setStatus(ok,label){
  if(!statusEl)return;
  statusEl.textContent=ok?"🟢 "+(label||"Sincronizzato"):"🔴 "+(label||"Offline");
  statusEl.style.color=ok?"#166534":"#b91c1c";
  statusEl.style.background=ok?"#dcfce7":"#fee2e2";
}
try{
  const app=initializeApp(firebaseConfig), db=getFirestore(app);
  const dataRef=doc(db,"gestionale","dati_spaccio");
  let applyingRemote=false, firstSnapshot=true;
  window.firebaseSaveData=async(data)=>{
    if(!navigator.onLine) throw new Error("Dispositivo offline: Firestore non raggiungibile.");
    await setDoc(dataRef,{...data,updatedAt:new Date().toISOString()});
    setStatus(true,"Sincronizzato");
  };
  window.addEventListener("online",()=>setStatus(true,"Online"));
  window.addEventListener("offline",()=>setStatus(false,"Offline"));
  const initial=await getDoc(dataRef);
  if(!initial.exists()){
    await setDoc(dataRef,{...window.spaccioCollectAllData(),updatedAt:new Date().toISOString()});
    setStatus(true,"Primo salvataggio");
  }
  onSnapshot(dataRef,(snap)=>{
    if(!snap.exists())return;
    const remote=snap.data();
    if(applyingRemote)return;
    applyingRemote=true;
    try{
      const {updatedAt,...payload}=remote;
      window.spaccioApplyAllData(payload);
      setStatus(true,"Sincronizzato");
    }catch(err){console.error("Errore applicazione dati Firestore:",err);setStatus(false,"Errore dati");}
    finally{applyingRemote=false;firstSnapshot=false;}
  },(error)=>{console.error("Firestore onSnapshot:",error);setStatus(false,"Offline / errore");});
}catch(error){
  console.error("Inizializzazione Firebase non riuscita:",error);
  setStatus(false,"Offline");
}
</script>
