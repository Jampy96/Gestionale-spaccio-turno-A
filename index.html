<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Spaccio Turno A - v36 Atomic Sync & POS</title>
<style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-alt: #f8fafc;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-soft: #eff6ff;
  --dark: #0f172a;
  --dark-soft: #1e293b;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --ok: #10b981;
  --ok-dark: #059669;
  --ok-soft: #ecfdf5;
  --warn: #f59e0b;
  --warn-soft: #fffbeb;
  --danger: #ef4444;
  --danger-dark: #dc2626;
  --danger-soft: #fef2f2;
  --cat-coffee: #d97706;
  --cat-coffee-bg: #fffbeb;
  --cat-drink: #0284c7;
  --cat-drink-bg: #f0f9ff;
  --cat-snack: #ea580c;
  --cat-snack-bg: #fff7ed;
  --radius: 18px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
}

button, input, select {
  font-family: inherit;
  touch-action: manipulation;
}

/* HEADER BAR */
header {
  background: var(--dark);
  color: #fff;
  padding: 12px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 60;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

header h1 {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding: 16px;
}

.screen {
  min-height: calc(100vh - 66px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
}

.auth {
  width: min(440px, 100%);
}

h2 {
  margin: 0 0 4px 0;
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: -0.025em;
}

h3 {
  margin: 0 0 12px 0;
  font-size: 1.08rem;
  font-weight: 800;
  color: var(--dark);
  display: flex;
  align-items: center;
  gap: 8px;
}

label {
  display: block;
  font-weight: 700;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin-bottom: 6px;
}

input, select {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 14px;
  font-size: 1.05rem;
  background: #fff;
  color: var(--text);
  margin: 0 0 14px 0;
  font-weight: 600;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
}

button {
  min-height: 52px;
  border: 0;
  border-radius: 14px;
  padding: 12px 18px;
  background: var(--primary);
  color: #fff;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.06s ease, background-color 0.1s ease;
}

button:active {
  transform: scale(0.97);
}

button:hover {
  background: var(--primary-dark);
}

button.secondary {
  background: var(--primary-soft);
  color: var(--primary-dark);
}

button.secondary:hover {
  background: #dbeafe;
}

button.ok-btn {
  background: var(--ok);
  color: #fff;
}

button.ok-btn:hover {
  background: var(--ok-dark);
}

button.ghost {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  min-height: 42px;
  padding: 8px 12px;
  font-size: 0.88rem;
  border-radius: 11px;
}

button.ghost:hover {
  background: rgba(255, 255, 255, 0.2);
}

button.danger {
  background: var(--danger);
  color: #fff;
}

button.danger:hover {
  background: var(--danger-dark);
}

button.big {
  width: 100%;
  min-height: 58px;
  font-size: 1.1rem;
  letter-spacing: 0.01em;
}

button:disabled {
  opacity: 0.42;
  cursor: not-allowed;
  transform: none;
}

/* BENTO TILES DASHBOARD */
.role-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.home-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.tile {
  min-height: 112px;
  flex-direction: column;
  text-align: center;
  font-size: 1.05rem;
  padding: 18px 14px;
  background: #fff;
  color: var(--dark);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  gap: 10px;
}

.tile:hover {
  background: var(--surface-alt);
  border-color: var(--primary);
}

.tile.primary-tile {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  border: 0;
}

.tile.balance-blue {
  background: linear-gradient(135deg, #0284c7, #0369a1);
  color: #fff;
  border: 0;
}

.tile.danger-tile {
  background: var(--danger-soft);
  color: var(--danger-dark);
  border-color: #fecaca;
}

.tile-icon-wrap {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: var(--primary-soft);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
}

.tile.primary-tile .tile-icon-wrap,
.tile.balance-blue .tile-icon-wrap {
  background: rgba(255,255,255,0.18);
  color: #fff;
}

.tile.danger-tile .tile-icon-wrap {
  background: #fee2e2;
  color: var(--danger);
}

/* SPLIT SCREEN POS LAYOUT (TABLET HORIZONTAL) */
.pos-split {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  gap: 16px;
  align-items: start;
}

.pos-receipt-col {
  position: sticky;
  top: 76px;
}

/* PILLOLE CLIENTE & DIPENDENTI */
.type-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.type-btn {
  min-height: 54px;
  background: var(--surface-alt);
  color: var(--text);
  border: 2px solid var(--border);
  font-size: 1rem;
}

.type-btn.active {
  background: var(--dark);
  color: #fff;
  border-color: var(--dark);
}

.emp-pill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
  max-height: 195px;
  overflow-y: auto;
  padding: 4px 2px;
  margin-bottom: 10px;
}

.emp-pill {
  min-height: 46px;
  padding: 8px 10px;
  background: var(--surface-alt);
  color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 0.92rem;
  font-weight: 700;
  justify-content: flex-start;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.emp-pill.selected {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* CATEGORIE E CARD PRODOTTI CON ILLUSTRAZIONI SVG */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.cat-btn {
  min-height: 54px;
  background: var(--surface-alt);
  color: var(--text);
  border: 2px solid var(--border);
  font-size: 0.98rem;
}

.cat-btn.active[data-cat="Caffetteria"] {
  background: var(--cat-coffee);
  color: #fff;
  border-color: var(--cat-coffee);
}

.cat-btn.active[data-cat="Bibite"] {
  background: var(--cat-drink);
  color: #fff;
  border-color: var(--cat-drink);
}

.cat-btn.active[data-cat="Merendine e snack"] {
  background: var(--cat-snack);
  color: #fff;
  border-color: var(--cat-snack);
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(152px, 1fr));
  gap: 12px;
}

.product {
  position: relative;
  background: #fff;
  border: 2px solid var(--border);
  color: var(--text);
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  min-height: 118px;
  padding: 12px;
  text-align: left;
  border-radius: 16px;
}

.product:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
}

.product.in-cart {
  border-color: var(--primary);
  background: #f8fbff;
}

.qty-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  min-width: 28px;
  height: 28px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--primary);
  color: #fff;
  font-weight: 900;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.prod-illus {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}

.prod-illus.coffee { background: var(--cat-coffee-bg); color: var(--cat-coffee); }
.prod-illus.drink { background: var(--cat-drink-bg); color: var(--cat-drink); }
.prod-illus.snack { background: var(--cat-snack-bg); color: var(--cat-snack); }

.product .p-name {
  font-weight: 700;
  font-size: 0.95rem;
  line-height: 1.2;
}

.product .p-price {
  color: var(--dark);
  font-weight: 900;
  font-size: 1.08rem;
  margin-top: 6px;
}

/* SCONTRINO DIGITALE & NUMPAD INTEGRATO */
.receipt-card {
  background: #fff;
  border: 2px solid var(--dark);
  border-radius: 20px;
  padding: 18px;
}

.receipt-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 2px dashed var(--border);
  margin-bottom: 10px;
}

.cart-list {
  max-height: 260px;
  overflow-y: auto;
}

.cart-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
}

.qty-controls {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.qty-btn {
  min-height: 42px;
  min-width: 42px;
  padding: 0;
  border-radius: 10px;
  font-size: 1.25rem;
}

.total-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--dark);
  color: #fff;
  padding: 14px 16px;
  border-radius: 14px;
  margin: 14px 0;
  font-size: 1.35rem;
  font-weight: 900;
}

.pay-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.pay-btn {
  min-height: 58px;
  font-size: 1.02rem;
}

/* CUSTOM POS NUMPAD (TASTIERINO NUMERICO INTEGRATO) */
.numpad-wrapper {
  background: var(--surface-alt);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 12px;
  margin-top: 12px;
}

.numpad-display {
  background: #fff;
  border: 2px solid var(--dark);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 1.65rem;
  font-weight: 900;
  text-align: right;
  margin-bottom: 10px;
  color: var(--dark);
  letter-spacing: -0.02em;
}

.quick-cash-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}

.quick-cash-btn {
  min-height: 46px;
  padding: 6px 2px;
  background: #fff;
  color: var(--dark);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-weight: 800;
  font-size: 0.9rem;
}

.quick-cash-btn:hover {
  background: var(--primary-soft);
  border-color: var(--primary);
}

.numpad-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.num-key {
  min-height: 54px;
  background: #fff;
  color: var(--dark);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 1.3rem;
  font-weight: 800;
}

.num-key:hover {
  background: var(--primary-soft);
  border-color: var(--primary);
}

.num-key.key-fn {
  background: #e2e8f0;
  color: var(--dark);
  font-size: 1.05rem;
}

/* ALTRI COMPONENTI */
.topbar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.badge {
  background: var(--primary-soft);
  color: var(--primary-dark);
  padding: 6px 12px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.86rem;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.stat-box {
  background: linear-gradient(135deg, #eff6ff, #dbeafe);
  border: 1.5px solid #bfdbfe;
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.stat-value {
  font-size: 2.1rem;
  font-weight: 900;
  color: var(--dark);
  letter-spacing: -0.03em;
}

.bar-order {
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  background: #fff;
}

.status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  background: #eef2f7;
  color: #475569;
  font-weight: 700;
  font-size: 0.84rem;
}

.status.ok { background: var(--ok-soft); color: var(--ok-dark); }
.status.neg { background: var(--danger-soft); color: var(--danger-dark); }

.muted { color: var(--muted); font-size: 0.9rem; }
.hidden { display: none !important; }
.balance-positive { color: var(--ok-dark); }
.balance-negative { color: var(--danger-dark); }

/* TOAST & MODALS */
#toastContainer {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(460px, calc(100% - 32px));
  pointer-events: none;
}

.toast {
  background: var(--dark);
  color: #fff;
  padding: 14px 18px;
  border-radius: 14px;
  font-weight: 700;
  font-size: 0.98rem;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideUp 0.16s ease-out;
}

.toast.ok { background: #064e3b; border-left: 5px solid #10b981; }
.toast.err { background: #7f1d1d; border-left: 5px solid #ef4444; }
.toast.info { background: #1e3a8a; border-left: 5px solid #3b82f6; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 9000;
}

.modal-box {
  background: #fff;
  border-radius: 20px;
  padding: 22px;
  width: min(450px, 100%);
  max-height: 92vh;
  overflow-y: auto;
}

.modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

@media (max-width: 840px) {
  .pos-split { grid-template-columns: 1fr; }
  .pos-receipt-col { position: static; }
}

@media (max-width: 640px) {
  .home-grid { grid-template-columns: repeat(2, 1fr); }
  .cat-grid, .role-grid { grid-template-columns: 1fr; }
  .wrap { padding: 12px; }
}
</style>
</head>
<body>

<header>
  <div class="brand-group">
    <button type="button" id="headerBackBtn" class="ghost hidden" style="background:var(--primary);font-weight:800" onclick="goBack()">← Indietro</button>
    <div class="brand-logo" style="cursor:pointer" onclick="goHome()" title="Torna alla Home / Selezione Ruolo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>
    </div>
    <h1 style="cursor:pointer" onclick="goHome()" title="Torna alla Home / Selezione Ruolo">Spaccio Turno A</h1>
  </div>
  <div class="header-actions">
    <span id="cloudStatus" class="badge" style="background:#fff;color:#475569">⚪ Connessione...</span>
    <button type="button" class="ghost" onclick="manualSaveData()">💾 Salva</button>
    <button type="button" class="ghost" onclick="exportJSON()">⬇️ JSON</button>
    <button type="button" class="ghost" onclick="document.getElementById('importJSONFile').click()">⬆️ Importa</button>
    <input id="importJSONFile" type="file" accept="application/json,.json" style="display:none" onchange="importJSON(event)">
  </div>
</header>

<section id="loginScreen" class="screen">
  <div class="card auth">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <div class="brand-logo" style="width:46px;height:46px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/></svg>
      </div>
      <div>
        <h2 style="margin:0">Accesso Cassa</h2>
        <span class="muted">Spaccio Turno A · v36 POS</span>
      </div>
    </div>
    <label>Username</label>
    <input id="username" autocomplete="username" placeholder="nome.cognome (es. giampaolo.muratore)">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <button class="big" onclick="login()">ENTRA NELLO SPACCIO</button>
    <p id="loginError" style="color:var(--danger);font-weight:700;margin-top:10px"></p>
  </div>
</section>

<section id="roleScreen" class="screen hidden">
  <div class="card auth">
    <h2>Seleziona Modalità</h2>
    <p class="muted" style="margin-top:0;margin-bottom:16px">Scegli la postazione operativa.</p>
    <div id="roleButtons" class="role-grid"></div>
    <button class="secondary" style="width:100%;margin-top:14px" onclick="logout()">ESCI DALL'ACCOUNT</button>
  </div>
</section>

<main id="app" class="wrap hidden"></main>
<div id="toastContainer"></div>
<div id="customModal" class="modal-backdrop hidden"></div>

<script>
// --- LIBRERIA ICONE & ILLUSTRAZIONI VETTORIALI SVG (ZERO PESO, NITIDEZZA RETINA) ---
const SVG_ICONS = {
  plus: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,

// --- NAVIGAZIONE INTERNA & INTERCETTAZIONE TASTO INDIETRO ANDROID ---
let navStack = [];
let currentScreenFn = null;

function updateBackButton() {
  const btn = document.getElementById("headerBackBtn");
  if (!btn) return;
  if (navStack.length > 0) btn.classList.remove("hidden");
  else btn.classList.add("hidden");
}

function navigateTo(fn, pushHistory = true) {
  if (currentScreenFn && currentScreenFn !== fn) navStack.push(currentScreenFn);
  currentScreenFn = fn;
  updateBackButton();
  if (pushHistory) {
    try { window.history.pushState({ spaccioNav: true }, ""); } catch (e) {}
  }
  fn();
}

function resetNav(fn) {
  navStack = [];
  currentScreenFn = fn;
  updateBackButton();
  try { window.history.replaceState({ spaccioNav: true }, ""); } catch (e) {}
}

function goBack() {
  if (navStack.length > 0) {
    const prev = navStack.pop();
    currentScreenFn = prev;
    updateBackButton();
    prev();
  } else if (role) {
    backToRoleChoice();
  }
}

window.addEventListener("popstate", () => {
  if (user) {
    if (navStack.length > 0) {
      goBack();
      try { window.history.pushState({ spaccioNav: true }, ""); } catch (err) {}
    } else if (role) {
      backToRoleChoice();
      try { window.history.pushState({ spaccioNav: true }, ""); } catch (err) {}
    }
  }
});

// --- PERSISTENZA SESSIONE ---
const SESSION_KEY = "spaccio_active_session_v1";
function saveSession() {
  if (user) localStorage.setItem(SESSION_KEY, JSON.stringify({ user, role }));
  else localStorage.removeItem(SESSION_KEY);
}
function restoreSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && saved.user && accounts[saved.user.username]) {
      user = saved.user;
      requestWakeLock();
      document.getElementById("loginScreen").classList.add("hidden");
      if (saved.role) {
        role = saved.role;
        renderHome();
      } else {
        document.getElementById("roleScreen").classList.remove("hidden");
        renderRoleChoice();
      }
      try { window.history.pushState({ spaccioNav: true }, ""); } catch (e) {}
    }
  } catch (e) {}
}

// --- NOTIFICHE FLUIDE & MODALI ---
function showToast(msg, type = "info") {
  const container = document.getElementById("toastContainer");
  if (!container) return;
  const el = document.createElement("div");
  el.className = "toast " + type;
  const icon = type === "ok" ? "✅" : type === "err" ? "⚠️" : "ℹ️";
  el.innerHTML = `<span>${icon}</span><span>${esc(msg)}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transition = "opacity 0.2s";
    setTimeout(() => el.remove(), 220);
  }, 2500);
}

function showConfirmModal(title, message, onConfirm, isDanger = false) {
  const modal = document.getElementById("customModal");
  modal.innerHTML = `<div class="modal-box">
    <h3>${esc(title)}</h3>
    <p class="muted" style="margin:0">${esc(message)}</p>
    <div class="modal-actions">
      <button class="secondary" id="modalCancelBtn">ANNULLA</button>
      <button class="${isDanger ? 'danger' : ''}" id="modalOkBtn">CONFERMA</button>
    </div>

  modal.classList.remove("hidden");
  document.getElementById("modalCancelBtn").onclick = () => modal.classList.add("hidden");
  document.getElementById("modalOkBtn").onclick = () => {

}

function showPromptModal(title, placeholder, isPassword, onSubmit) {
  const modal = document.getElementById("customModal");
  modal.innerHTML = `<div class="modal-box">
    <h3>${esc(title)}</h3>
    <input id="modalPromptInput" type="${isPassword ? 'password' : 'text'}" placeholder="${esc(placeholder)}">

      <button class="secondary" id="modalCancelBtn">ANNULLA</button>
      <button id="modalOkBtn">CONFERMA</button>
    </div>
  </div>`;
  modal.classList.remove("hidden");
  const inp = document.getElementById("modalPromptInput");
  inp.focus();
  inp.onkeydown = (e) => { if (e.key === "Enter") document.getElementById("modalOkBtn").click(); };
  document.getElementById("modalCancelBtn").onclick = () => modal.classList.add("hidden");
  document.getElementById("modalOkBtn").onclick = () => {
    const val = inp.value;
    modal.classList.add("hidden");
    onSubmit(val);
  };
}

let numpadBuffer = "";
function openNumpadModal(title, subtitle, initialValue, quickAmounts, confirmBtnColor, onConfirm) {
  numpadBuffer = initialValue !== null && initialValue !== undefined ? String(initialValue) : "";
  const modal = document.getElementById("customModal");

  function renderNumpad() {

      <h3 style="margin-bottom:4px">${esc(title)}</h3>
      <p class="muted" style="margin:0 0 10px 0">${esc(subtitle)}</p>
      <div class="numpad-display">${esc(displayVal)} €</div>
      ${quicks.length ? `
        <div style="display:grid;grid-template-columns:repeat(${quicks.length},1fr);gap:6px;margin-bottom:8px">
          ${quicks.map(q => `<button type="button" class="quick-cash-btn" onclick="numpadQuick('${q.val}')">${esc(q.label)}</button>`).join("")}
        </div>` : ""}
      <div class="numpad-grid">
        <button type="button" class="num-key" onclick="numpadPress('7')">7</button>
        <button type="button" class="num-key" onclick="numpadPress('8')">8</button>
        <button type="button" class="num-key" onclick="numpadPress('9')">9</button>
        <button type="button" class="num-key" onclick="numpadPress('4')">4</button>
        <button type="button" class="num-key" onclick="numpadPress('5')">5</button>
        <button type="button" class="num-key" onclick="numpadPress('6')">6</button>
        <button type="button" class="num-key" onclick="numpadPress('1')">1</button>
        <button type="button" class="num-key" onclick="numpadPress('2')">2</button>
        <button type="button" class="num-key" onclick="numpadPress('3')">3</button>
        <button type="button" class="num-key key-fn" onclick="numpadPress('.')">,</button>
        <button type="button" class="num-key" onclick="numpadPress('0')">0</button>
        <button type="button" class="num-key key-fn" onclick="numpadPress('DEL')">⌫</button>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary" onclick="document.getElementById('customModal').classList.add('hidden')">ANNULLA</button>
        <button type="button" style="background:${confirmBtnColor || 'var(--ok)'}" onclick="numpadSubmit()">CONFERMA</button>
      </div>
    </div>`;
  }

  window.numpadPress = (k) => {
    if (k === "DEL") {
      numpadBuffer = numpadBuffer.slice(0, -1);
    } else if (k === ".") {
      if (!numpadBuffer.includes(".")) numpadBuffer = (numpadBuffer === "" ? "0." : numpadBuffer + ".");
    } else {
      if (numpadBuffer.includes(".") && numpadBuffer.split(".")[1].length >= 2) return;
      numpadBuffer += k;
    }
    renderNumpad();
  };
  window.numpadQuick = (val) => { numpadBuffer = String(val); renderNumpad(); };
  window.numpadSubmit = () => {
    const val = Number(numpadBuffer);
    modal.classList.add("hidden");
    onConfirm(val);
  };

  modal.classList.remove("hidden");
  renderNumpad();
}

// --- SICUREZZA SHA-256 & WAKE LOCK ---
async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
const DEFAULT_ADMIN_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
const DEFAULT_SUPERADMIN_HASH = "2320e598a54b3fed4918ce8557db69deac82a6cadd27ef0c466575032faf4d59";
const DEFAULT_EMP_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

async function verifyPassword(plainInput, storedSecret) {
  if (!storedSecret) return false;
  if (/^[a-f0-9]{64}$/i.test(storedSecret)) {
    const h = await sha256(plainInput);
    return h === storedSecret.toLowerCase();
  }
  return plainInput === storedSecret;
}

let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});

function makeNomeCognomeUsername(fullName) {
  const clean = String(fullName || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) {
    // Employees are stored as "Cognome Nome" (e.g., "Muratore Giampaolo" -> "giampaolo.muratore")
    const cognome = parts[0];
    const nome = parts.slice(1).join("");
    return `${nome}.${cognome}`;
  }
  return parts[0] || "utente";
}

const PENDING_OPS_KEY = "spaccio_pending_ops_v1";

// Applies a single atomic operation onto any target state object (used both inside Firestore runTransaction and locally)
function applyAtomicOpToState(state, op) {
  if (!state || typeof state !== "object") return state;
  state.balances = state.balances && typeof state.balances === "object" ? { ...state.balances } : {};
  state.orders = Array.isArray(state.orders) ? [...state.orders] : [];
  state.balanceMovements = Array.isArray(state.balanceMovements) ? [...state.balanceMovements] : [];
  state.mealMovements = Array.isArray(state.mealMovements) ? [...state.mealMovements] : [];
  state.credentials = state.credentials && typeof state.credentials === "object" ? { ...state.credentials } : {};
  state.employeeRoles = state.employeeRoles && typeof state.employeeRoles === "object" ? { ...state.employeeRoles } : {};
  state.products = Array.isArray(state.products) ? [...state.products] : [];
  state.employees = Array.isArray(state.employees) ? [...state.employees] : [];
  state.stock = state.stock && typeof state.stock === "object" ? { ...state.stock } : {};

  switch (op.type) {
    case "NEW_ORDER": {
      const ord = { ...op.order };
      // Deduplicate if already committed
      if (!state.orders.some(x => x.uid && ord.uid && x.uid === ord.uid)) {
        const maxId = state.orders.reduce((m, x) => Math.max(m, Number(x.id) || 0), Number(state.nextId || 1) - 1);
        ord.id = maxId + 1;
        state.nextId = ord.id + 1;
        state.orders.push(ord);
        if (ord.payment === "subito") {
          state.fondocassa = Number(state.fondocassa || 0) + Number(ord.total || 0);
        } else if (ord.payment === "conto" && ord.customerType === "employee") {
          state.balances[ord.customer] = Number(state.balances[ord.customer] || 0) - Number(ord.total || 0);
        }
      }
      break;
    }
    case "EDIT_ORDER": {
      const idx = state.orders.findIndex(x => x.id === op.orderId);
      if (idx >= 0) {
        const oldTotal = Number(state.orders[idx].total || 0);
        state.orders[idx] = { ...state.orders[idx], ...op.patch };
        state.fondocassa = Number(state.fondocassa || 0) + (Number(op.patch.total || 0) - oldTotal);
      }
      break;
    }
    case "BALANCE_DELTA": {
      const mov = { ...op.movement };
      if (!state.balanceMovements.some(x => x.id === mov.id)) {
        const oldBal = Number(state.balances[op.employee] || 0);
        const delta = Number(op.delta || 0);
        if (oldBal < 0 && delta > 0) state.fondocassa = Number(state.fondocassa || 0) + delta;
        if (oldBal > 0 && delta < 0) state.fondocassa = Number(state.fondocassa || 0) + delta;
        state.balances[op.employee] = oldBal + delta;
        state.balanceMovements.push(mov);
      }
      break;
    }
    case "MEAL_DEBIT": {
      const now = op.date;
      (op.entries || []).forEach(ent => {
        if (!state.mealMovements.some(x => x.id === ent.id)) {
          state.balances[ent.employee] = Number(state.balances[ent.employee] || 0) - Number(ent.amount || 0);
          state.mealMovements.push(ent);
        }
      });
      break;
    }
    case "UPDATE_CREDENTIAL": {
      if (op.employee && Array.isArray(op.cred)) {
        state.credentials[op.employee] = [...op.cred];
      }
      if (op.employee && op.roleLevel) {
        state.employeeRoles[op.employee] = op.roleLevel;
      }
      break;
    }
    case "SET_FUND": {
      state.fondocassa = Number(op.value || 0);
      break;
    }
    case "SET_SAFE": {
      state.cassaforte = Number(op.value || 0);
      break;
    }
    case "SET_STOCK": {
      state.stock = { ...state.stock, ...(op.stock || {}) };
      break;
    }
    case "ADD_PRODUCT": {
      if (op.product && !state.products.some(p => p.name.toLowerCase() === op.product.name.toLowerCase())) {
        state.products.push({ ...op.product });
      }
      break;
    }
    case "REMOVE_PRODUCT": {
      state.products = state.products.filter(p => p.name.toLowerCase() !== String(op.name || "").toLowerCase());
      break;
    }
    case "ADD_EMPLOYEE": {
      const n = op.name;
      if (n && !state.employees.some(x => x.toLowerCase() === n.toLowerCase())) {
        state.employees.push(n);
        state.employees.sort((a, b) => a.localeCompare(b, "it", { sensitivity: "base" }));
        state.balances[n] = 0;
        if (op.cred) state.credentials[n] = [...op.cred];
        state.employeeRoles[n] = op.roleLevel || "consumer";
      }
      break;
    }
    case "RENAME_EMPLOYEE": {
      const { oldName, newName } = op;
      const idx = state.employees.indexOf(oldName);
      if (idx >= 0) {
        state.employees[idx] = newName;
        state.employees.sort((a, b) => a.localeCompare(b, "it", { sensitivity: "base" }));
        if (oldName !== newName) {
          state.balances[newName] = Number(state.balances[oldName] || 0);
          delete state.balances[oldName];
          if (state.credentials[oldName]) {
            state.credentials[newName] = state.credentials[oldName];
            delete state.credentials[oldName];
          }
          if (state.employeeRoles[oldName]) {
            state.employeeRoles[newName] = state.employeeRoles[oldName];
            delete state.employeeRoles[oldName];
          }
        }
      }
      break;
    }
    case "REMOVE_EMPLOYEE": {
      const n = op.name;
      state.employees = state.employees.filter(x => x !== n);
      delete state.balances[n];
      delete state.credentials[n];
      delete state.employeeRoles[n];
      break;
    }
    case "CLEAR_HISTORY": {
      state.orders = [];
      state.balanceMovements = [];
      state.mealMovements = [];
      break;
    }
  }
  return state;
}
window.spaccioApplyAtomicOpToState = applyAtomicOpToState;

function enqueueAtomicOp(op) {
  op.opId = Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  pendingOps.push(op);

  flushAtomicOps();
}

let isFlushingOps = false;
async function flushAtomicOps() {
  if (isFlushingOps || pendingOps.length === 0) return;
  if (!window.firebaseRunAtomicBatch) return;
  isFlushingOps = true;
  if (window.setCloudBadge) window.setCloudBadge("saving", `Sincronizzazione (${pendingOps.length})...`);
  try {
    const batch = pendingOps.slice();
    await window.firebaseRunAtomicBatch(batch);
    const committedIds = new Set(batch.map(x => x.opId));
    pendingOps = pendingOps.filter(x => !committedIds.has(x.opId));
    savePendingOps();
    if (pendingOps.length > 0) {
      isFlushingOps = false;
      flushAtomicOps();
      return;
    }
    if (window.setCloudBadge) window.setCloudBadge("ok", "Sincronizzato");
  } catch (err) {
    console.error("Transazione atomica in attesa (riproverà online):", err);
    if (window.setCloudBadge) window.setCloudBadge("err", `In coda (${pendingOps.length})`);
  } finally {
    isFlushingOps = false;
  }
}
window.flushAtomicOps = flushAtomicOps;

function applyAllData(data) {
  if (!data || typeof data !== "object") throw new Error("JSON non valido.");
  let merged = JSON.parse(JSON.stringify(data));
  if (Array.isArray(pendingOps) && pendingOps.length > 0) {
    pendingOps.forEach(op => { merged = applyAtomicOpToState(merged, op); });
  }
  if (Array.isArray(merged.employees)) employees = merged.employees.filter(x => typeof x === "string").sort((a, b) => a.localeCompare(b, "it", { sensitivity: "base" }));
  if (Array.isArray(merged.orders)) orders = merged.orders;
  if (Array.isArray(merged.products) && merged.products.length > 0) products = merged.products;
  if (Number.isFinite(Number(merged.nextId))) nextId = Number(merged.nextId);
  if (merged.balances && typeof merged.balances === "object") balances = merged.balances;
  if (Number.isFinite(Number(merged.fondocassa))) fondocassa = Number(merged.fondocassa);
  if (Number.isFinite(Number(merged.cassaforte))) cassaforte = Number(merged.cassaforte);
  if (Array.isArray(merged.mealMovements)) mealMovements = merged.mealMovements;
  if (Array.isArray(merged.balanceMovements)) balanceMovements = merged.balanceMovements;
  if (merged.stock && typeof merged.stock === "object") stock = merged.stock;
  if (merged.credentials && typeof merged.credentials === "object") credentials = merged.credentials;
  if (merged.employeeRoles && typeof merged.employeeRoles === "object") employeeRoles = merged.employeeRoles;
  ensureAllEmployeeAccounts();
  stockItems.forEach(n => { if (typeof stock[n] !== "number") stock[n] = 0; });
  Object.keys(stock).forEach(n => { if (!stockItems.includes(n)) delete stock[n]; });
  employees.forEach(n => { if (typeof balances[n] !== "number") balances[n] = 0; });
  rebuildAccounts();
  if (merged.dailyOrderState) localStorage.setItem(DAILY_ORDER_KEY, merged.dailyOrderState);
  saveLocalOnly();
  // Smart live refresh without interrupting active typing or open POS receipt
  const isTyping = document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName);
  const modalOpen = !document.getElementById("customModal")?.classList.contains("hidden");
  if (role && !document.getElementById("categoryProducts") && !isTyping && !modalOpen && typeof currentScreenFn === "function") {
    currentScreenFn();
  }
}

async function login() {
  const u = document.getElementById("username").value.trim().toLowerCase();
  const p = document.getElementById("password").value;
  const err = document.getElementById("loginError");
  err.textContent = "";
  if (!accounts[u] || !(await verifyPassword(p, accounts[u].password))) {
    err.textContent = "Username o password non validi.";
    return;
  }
  user = { username: u, employee: accounts[u].employee || null };
  saveSession();
  requestWakeLock();
  try { window.history.pushState({ spaccioNav: true }, ""); } catch (e) {}
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("roleScreen").classList.remove("hidden");
  renderRoleChoice();
}

function logout() {
  user = null; role = null; cart = []; navStack = []; currentScreenFn = null; updateBackButton(); saveSession();
  document.getElementById("app").innerHTML = "";
  document.getElementById("app").classList.add("hidden");
  document.getElementById("roleScreen").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("loginError").textContent = "";
}

function selectRole(r) {
  const level = getUserPrivilegeLevel(user);
  if (r === "Amministratore" && level !== "admin") {
    showToast("Privilegi di Amministratore non abilitati per questo utente.", "err");
    return;
  }
  if (r === "Cassiere" && level !== "admin" && level !== "cashier") {
    showToast("Privilegi di Cassiere non abilitati per questo utente.", "err");
    return;
  }
  if (r === "Amministratore") {
    showPromptModal("Password Amministratore", "Inserisci password aggiuntiva", true, async (extra) => {
      if (!extra || !(await verifyPassword(extra, DEFAULT_SUPERADMIN_HASH))) {
        showToast("Password amministratore non corretta.", "err");
        return;
      }
      role = r;
      saveSession();
      document.getElementById("roleScreen").classList.add("hidden");
      renderHome();
    });
    return;
  }
  role = r;
  saveSession();
  document.getElementById("roleScreen").classList.add("hidden");
  renderHome();
}


function goHome() {
  if (!user) return;
  if (!role) {
    backToRoleChoice();
    return;
  }
  // If role is active, reset navigation stack and go to the role's home screen
  renderHome();
  showToast("🏠 Torna alla Home", "info");
}

function renderHome() {
  const app = document.getElementById("app");
  app.classList.remove("hidden");
  if (role === "Cassiere") { resetNav(cashierHome); cashierHome(); }
  else if (role === "Dipendente") { resetNav(employeeHome); employeeHome(); }
  else { resetNav(adminHome); adminHome(); }
}

function backToRoleChoice() {
  role = null; cart = []; navStack = []; currentScreenFn = null; updateBackButton(); saveSession();
  document.getElementById("app").innerHTML = "";
  document.getElementById("app").classList.add("hidden");
  document.getElementById("roleScreen").classList.remove("hidden");
}

function addCart(i) {
  const p = products[i], found = cart.find(x => x.name === p.name);
  if (found) found.qty++;
  else cart.push({ name: p.name, price: p.price, qty: 1 });
  showCategory(activeCategory);
  renderCart();
}

function changeCartQty(i, delta) {

  renderCart();
}

          <button type="button" class="quick-cash-btn" onclick="setPosCash('2')">2 €</button>
          <button type="button" class="quick-cash-btn" onclick="setPosCash('5')">5 €</button>
          <button type="button" class="quick-cash-btn" onclick="setPosCash('10')">10 €</button>

          <button type="button" class="num-key" onclick="posPadKey('7')">7</button>
          <button type="button" class="num-key" onclick="posPadKey('8')">8</button>
          <button type="button" class="num-key" onclick="posPadKey('9')">9</button>
          <button type="button" class="num-key" onclick="posPadKey('4')">4</button>
          <button type="button" class="num-key" onclick="posPadKey('5')">5</button>
          <button type="button" class="num-key" onclick="posPadKey('6')">6</button>
          <button type="button" class="num-key" onclick="posPadKey('1')">1</button>
          <button type="button" class="num-key" onclick="posPadKey('2')">2</button>

          <button type="button" class="num-key key-fn" onclick="posPadKey('.')">,</button>

function toggleCashPad() {
  const total = cart.reduce((s, x) => s + x.price * x.qty, 0);
  showCashPad = !showCashPad;
  cashInputStr = total.toFixed(2);
  renderCart();
}

function setPosCash(val) {
  cashInputStr = String(val);
  renderCart();
}

function posPadKey(k) {
  if (k === "DEL") {
    cashInputStr = cashInputStr.slice(0, -1);
  } else if (k === ".") {
    if (!cashInputStr.includes(".")) cashInputStr = (cashInputStr === "" ? "0." : cashInputStr + ".");
  } else {
    if (cashInputStr.includes(".") && cashInputStr.split(".")[1].length >= 2) return;
    cashInputStr += k;
  }
  renderCart();
}

function confirmOrder(mode) {
  const total = cart.reduce((s, x) => s + x.price * x.qty, 0);
  const name = selectedCustomerType === "employee"
    ? selectedEmployeeName
    : (document.getElementById("customerName")?.value?.trim() || "Cliente esterno");

  if (editingOrderId !== null) {
    if (mode !== "subito") { showToast("Un ordine modificato va chiuso con PAGA SUBITO.", "err"); return; }
    const o = orders.find(x => x.id === editingOrderId);
    if (!o) { showToast("Ordine non trovato.", "err"); return; }
    const cash = cashInputStr === "" ? total : Number(cashInputStr);
    if (cash < total) { showToast("Contante ricevuto insufficiente.", "err"); return; }
    const oldTotal = Number(o.total || 0);
    const patch = {
      customerType: selectedCustomerType, customer: name, items: cart.map(x => ({ ...x })),
      total, cash, change: cash - total, paid: true, payment: "subito",
      status: "Completato", paidAt: new Date().toISOString()
    };
    Object.assign(o, patch);
    fondocassa += (total - oldTotal);
    editingOrderId = null;
    enqueueAtomicOp({ type: "EDIT_ORDER", orderId: o.id, patch });
    showToast(`Ordine #${o.number} aggiornato!`, "ok");
    renderHome();
    return;
  }

  let paid = false, cash = null, change = null, paymentLabel = "";
  if (mode === "subito") {
    cash = cashInputStr === "" ? total : Number(cashInputStr);
    if (cash < total) { showToast("Contante ricevuto insufficiente.", "err"); return; }
    paid = true; change = cash - total; paymentLabel = "Pagato subito";
    fondocassa += total;
  } else if (mode === "conto") {
    if (selectedCustomerType !== "employee") { showToast("Solo per dipendenti.", "err"); return; }
    balances[name] = (balances[name] || 0) - total;
    paid = true;
    paymentLabel = "Messo in conto";
  }

  const now = new Date().toISOString();
  const order = {
    id: nextId++, uid: Date.now() + "_" + Math.random().toString(36).slice(2, 8),
    date: now, dateKey: localDateKey(new Date()), number: nextDailyOrderNumber(),
    customerType: selectedCustomerType, customer: name, items: cart.map(x => ({ ...x })),
    total, cash, change, paid, payment: mode, status: "Completato",
    createdByUsername: user?.username || "—", createdByEmployee: user?.employee || "—", createdByRole: role || "Cassiere"
  };
  orders.push(order);
  enqueueAtomicOp({ type: "NEW_ORDER", order });
  showToast(`Ordine #${order.number} registrato (${paymentLabel})`, "ok");
  renderHome();
}

// --- SALDO DIPENDENTI: TASTI SEPARATI "VERSA / SALDA" (VERDE) E "ADDEBITA" (ROSSO) ---
function applyEmployeeBalanceChange(name, delta, customNote = null) {
  const oldBalance = Number(balances[name] || 0);
  const newBalance = oldBalance + delta;
  if (oldBalance < 0 && delta > 0) fondocassa += delta;
  if (oldBalance > 0 && delta < 0) fondocassa += delta;
  balances[name] = newBalance;

  const mov = {
    id: Date.now() + Math.random(),
    date: new Date().toISOString(),
    employee: name,
    amount: delta,
    note: customNote || (delta > 0 ? "Versamento / Saldo conto" : "Addebito manuale"),
    by: formatOperatorAudit(user),
    byUsername: user?.username || "—",
    byRole: role || "—"
  };
  balanceMovements.push(mov);
  enqueueAtomicOp({ type: "BALANCE_DELTA", employee: name, delta, movement: mov });
}

function filterEmployeeCards(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll(".emp-balance-card").forEach(card => {
    const name = card.getAttribute("data-name") || "";
    card.classList.toggle("hidden", !name.includes(q));
  });
}

function openDepositNumpad(name, isAdmin = false) {
  const cur = Number(balances[name] || 0);
  const debt = cur < 0 ? Math.abs(cur) : 0;
  const suggested = debt > 0 ? debt.toFixed(2) : "10";
  const quicks = [];
  if (debt > 0) quicks.push({ label: `Salda (${euro(debt)})`, val: debt.toFixed(2) });
  quicks.push({ label: "5 €", val: "5" }, { label: "10 €", val: "10" }, { label: "20 €", val: "20" });

  openNumpadModal(
    `💵 Versa / Salda: ${name}`,
    `Saldo attuale: ${euro(cur)} · Digita i soldi consegnati dal collega`,
    suggested,
    quicks,
    "var(--ok)",
    (amount) => {
      if (!Number.isFinite(amount) || amount <= 0) {
        showToast("Inserisci un importo maggiore di zero.", "err");
        return;
      }
      applyEmployeeBalanceChange(name, +amount, "Versamento / Saldo conto");
      showToast(`Aggiunti ${euro(amount)} al saldo di ${name}!`, "ok");
      if (isAdmin) adminEmployeeBalancesView();
      else employeeBalancesView();
    }
  );
}

function openDebitNumpad(name, isAdmin = false) {
  const cur = Number(balances[name] || 0);
  const quicks = [
    { label: "1 €", val: "1" },
    { label: "2 €", val: "2" },
    { label: "5 €", val: "5" },
    { label: "10 €", val: "10" }
  ];

  openNumpadModal(
    `➖ Addebita: ${name}`,
    `Saldo attuale: ${euro(cur)} · Digita l'importo da scalare`,
    "",
    quicks,
    "var(--danger)",
    (amount) => {
      if (!Number.isFinite(amount) || amount <= 0) {
        showToast("Inserisci un importo maggiore di zero.", "err");
        return;
      }
      applyEmployeeBalanceChange(name, -amount, "Addebito manuale");
      showToast(`Addebitati ${euro(amount)} a ${name}.`, "info");
      if (isAdmin) adminEmployeeBalancesView();
      else employeeBalancesView();
    }
  );
}

function employeeBalancesView() {
  const rows = employees.slice().sort((a, b) => a.localeCompare(b, "it", { sensitivity: "base" })).map(name => {
    const bal = Number(balances[name] || 0);

        <div class="${bal < 0 ? "balance-negative" : "balance-positive"}" style="font-size:1.25rem;font-weight:900">${euro(bal)}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="ok-btn" onclick='openDepositNumpad(${JSON.stringify(name)}, false)'>💵 VERSA / SALDA</button>
        <button type="button" class="danger" onclick='openDebitNumpad(${JSON.stringify(name)}, false)'>➖ ADDEBITA</button>
      </div>
    </div>`;
  }).join("");

  shell("Saldo Dipendenti", `

// --- STORICO PAGINATO ---
function itemsText(o) { return o.items.map(x => `${x.name} × ${x.qty}`).join(", "); }

let auditFilterType = "all"; // 'all' | 'orders' | 'deposits' | 'debits'
let auditFilterPeriod = "today"; // 'today' | 'all'
let auditSearchQuery = "";

function buildAuditEntries() {
  const entries = [];

  orders.forEach(o => {
    const isCash = o.payment === "subito";
    entries.push({
      id: "ord_" + o.id,
      date: o.date || "",
      dateKey: o.dateKey || (o.date ? localDateKey(new Date(o.date)) : ""),
      category: "orders",
      subType: isCash ? "order_cash" : "order_account",
      badgeText: isCash ? "💵 Ordine Pagato Subito" : "📒 Ordine in Conto",
      badgeClass: isCash ? "ok" : "",
      title: `Ordine #${o.number} · ${o.customer}`,
      detail: itemsText(o),
      amount: Number(o.total || 0),
      sign: isCash ? "+" : "-",
      amountClass: isCash ? "balance-positive" : "balance-negative",
      operator: orderAccount(o),
      searchBlob: `${o.number} ${o.customer} ${itemsText(o)} ${orderAccount(o)}`.toLowerCase()
    });
  });

  balanceMovements.forEach(b => {
    const amt = Number(b.amount || 0);
    const isDeposit = amt >= 0;
    const op = b.by || "—";
    entries.push({
      id: "bal_" + b.id,
      date: b.date || "",
      dateKey: b.date ? localDateKey(new Date(b.date)) : "",
      category: isDeposit ? "deposits" : "debits",
      subType: isDeposit ? "deposit" : "manual_debit",
      badgeText: isDeposit ? "🟢 Versamento / Saldo" : "🔴 Addebito Manuale",
      badgeClass: isDeposit ? "ok" : "neg",
      title: `${b.employee}`,
      detail: b.note || (isDeposit ? "Versamento / Saldo conto" : "Addebito manuale"),
      amount: Math.abs(amt),
      sign: isDeposit ? "+" : "-",
      amountClass: isDeposit ? "balance-positive" : "balance-negative",
      operator: op,
      searchBlob: `${b.employee} ${b.note || ""} ${op}`.toLowerCase()
    });
  });

  mealMovements.forEach(m => {
    const amt = Number(m.amount || 0);
    const op = m.by || "Amministratore";
    entries.push({
      id: "meal_" + m.id,
      date: m.date || "",
      dateKey: m.date ? localDateKey(new Date(m.date)) : "",
      category: "debits",
      subType: "meal_debit",
      badgeText: "🍽️ Addebito Pasto Turno",
      badgeClass: "neg",
      title: `${m.employee}`,
      detail: m.type || "Pranzo/Cena con il turno",
      amount: Math.abs(amt),
      sign: "-",
      amountClass: "balance-negative",
      operator: op,
      searchBlob: `${m.employee} pranzo cena turno ${op}`.toLowerCase()
    });
  });

  return entries.sort((a, b) => new Date(b.date) - new Date(a.date));
}

function setAuditFilter(type) {
  auditFilterType = type;
  historyView(auditFilterType, auditFilterPeriod, 40);
}

function setAuditPeriod(period) {
  auditFilterPeriod = period;
  historyView(auditFilterType, auditFilterPeriod, 40);
}

function onAuditSearchInput(val) {
  auditSearchQuery = val;
  renderAuditList(40);
}

function historyView(type = auditFilterType, period = auditFilterPeriod, limit = 40) {
  auditFilterType = type;
  auditFilterPeriod = period;

  shell("Registro & Controllo Incrociato", `
    <div class="card" style="padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <div class="type-switch" style="margin:0;flex:1;min-width:240px">
          <button type="button" class="type-btn ${auditFilterPeriod === 'today' ? 'active' : ''}" style="min-height:44px;font-size:0.92rem" onclick="setAuditPeriod('today')">📅 Solo Oggi</button>
          <button type="button" class="type-btn ${auditFilterPeriod === 'all' ? 'active' : ''}" style="min-height:44px;font-size:0.92rem" onclick="setAuditPeriod('all')">🗂️ Tutto lo Storico</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px">

        <button type="button" class="cat-btn ${auditFilterType === 'orders' ? 'active' : ''}" style="min-height:44px;font-size:0.86rem;padding:6px;${auditFilterType === 'orders' ? 'background:var(--primary);color:#fff;border-color:var(--primary)' : ''}" onclick="setAuditFilter('orders')">☕ Ordini</button>

        <button type="button" class="cat-btn ${auditFilterType === 'debits' ? 'active' : ''}" style="min-height:44px;font-size:0.86rem;padding:6px;${auditFilterType === 'debits' ? 'background:var(--danger);color:#fff;border-color:var(--danger)' : ''}" onclick="setAuditFilter('debits')">🔴 Addebiti</button>
      </div>

    <div id="auditSummaryBox"></div>
    <div id="auditListContainer"></div>
  `);

  renderAuditList(limit);

function renderAuditList(limit = 40) {
  const allEntries = buildAuditEntries();
  const todayStr = localDateKey();
  const q = auditSearchQuery.trim().toLowerCase();

  // Period filter first (for accurate period totals)
  const periodEntries = allEntries.filter(e => auditFilterPeriod === "all" || e.dateKey === todayStr);

  // Calculate cross-check summary KPIs for the selected period
  const cashOrdersTotal = periodEntries.filter(e => e.subType === "order_cash").reduce((s, e) => s + e.amount, 0);
  const accountOrdersTotal = periodEntries.filter(e => e.subType === "order_account").reduce((s, e) => s + e.amount, 0);
  const depositsTotal = periodEntries.filter(e => e.subType === "deposit").reduce((s, e) => s + e.amount, 0);
  const debitsTotal = periodEntries.filter(e => e.subType === "manual_debit" || e.subType === "meal_debit").reduce((s, e) => s + e.amount, 0);

  const summaryBox = document.getElementById("auditSummaryBox");
  if (summaryBox) {
    const periodLabel = auditFilterPeriod === "today" ? "Riepilogo di Oggi" : "Riepilogo Globale";
    summaryBox.innerHTML = `
      <div class="stat-box" style="padding:14px 16px;gap:10px">
        <div style="width:100%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #bfdbfe;padding-bottom:8px">
          <span style="font-weight:800;font-size:0.82rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--primary-dark)">📊 ${periodLabel} · Controllo Incrociato</span>
          <span class="badge" style="background:#fff">${periodEntries.length} operazioni</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;width:100%">
          <div style="background:#fff;padding:10px 12px;border-radius:12px;border:1px solid #dbeafe">
            <div class="muted" style="font-size:0.78rem;font-weight:700">💵 Ordini Pagati Subito</div>
            <div style="font-size:1.2rem;font-weight:900;color:var(--ok-dark)">${euro(cashOrdersTotal)}</div>
          </div>
          <div style="background:#fff;padding:10px 12px;border-radius:12px;border:1px solid #dbeafe">
            <div class="muted" style="font-size:0.78rem;font-weight:700">🟢 Versamenti / Saldi</div>
            <div style="font-size:1.2rem;font-weight:900;color:var(--ok-dark)">${euro(depositsTotal)}</div>
          </div>
          <div style="background:#fff;padding:10px 12px;border-radius:12px;border:1px solid #dbeafe">
            <div class="muted" style="font-size:0.78rem;font-weight:700">📒 Ordini in Conto</div>
            <div style="font-size:1.2rem;font-weight:900;color:var(--dark)">${euro(accountOrdersTotal)}</div>
          </div>
          <div style="background:#fff;padding:10px 12px;border-radius:12px;border:1px solid #dbeafe">
            <div class="muted" style="font-size:0.78rem;font-weight:700">🔴 Addebiti / Pasti</div>
            <div style="font-size:1.2rem;font-weight:900;color:var(--danger-dark)">${euro(debitsTotal)}</div>
          </div>
        </div>
      </div>`;
  }

  // Apply category & text search filters
  const filtered = periodEntries.filter(e => {
    if (auditFilterType !== "all" && e.category !== auditFilterType) return false;
    if (q && !e.searchBlob.includes(q)) return false;
    return true;
  });

  const visible = filtered.slice(0, limit);
  const hasMore = filtered.length > limit;
  const listContainer = document.getElementById("auditListContainer");
  if (!listContainer) return;

  const cardsHtml = visible.length ? visible.map(e => `
    <div class="bar-order">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
        <span class="status ${e.badgeClass}">${e.badgeText}</span>
        <span class="muted" style="font-weight:700;font-size:0.85rem">🕒 ${e.date ? localDateTime(e.date) : "—"}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px">
        <div>
          <b style="font-size:1.05rem">${esc(e.title)}</b>
          <div style="margin-top:2px;color:var(--text)">${esc(e.detail)}</div>
        </div>
        <div class="${e.amountClass}" style="font-size:1.2rem;font-weight:900;white-space:nowrap">
          ${e.sign}${euro(e.amount)}
        </div>
      </div>
      <div style="padding-top:6px;border-top:1px dashed var(--border);font-size:0.84rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <span>👤 Registrato da: <b style="color:var(--dark)">${esc(e.operator)}</b></span>
      </div>
    </div>`).join("") : `<div class="card"><p class="muted" style="text-align:center;margin:12px 0">Nessuna operazione trovata con i filtri selezionati.</p></div>`;

  listContainer.innerHTML = `
    ${cardsHtml}
    ${hasMore ? `<button type="button" class="secondary" style="width:100%;margin-bottom:10px" onclick="renderAuditList(${limit + 40})">Carica altre 40 operazioni (${filtered.length - limit} rimanenti)</button>` : ""}
  `;
}

async function changeOwnPassword() {
  const a = document.getElementById("newEmpPassword")?.value || "";
  const b = document.getElementById("confirmEmpPassword")?.value || "";
  if (a.length < 4) { showToast("La password deve avere almeno 4 caratteri.", "err"); return; }
  if (a !== b) { showToast("Le password non coincidono.", "err"); return; }
  if (!user.employee || !credentials[user.employee]) { showToast("Account non disponibile.", "err"); return; }
  const hashed = await sha256(a);
  credentials[user.employee] = [credentials[user.employee][0], hashed];
  rebuildAccounts();
  enqueueAtomicOp({ type: "UPDATE_CREDENTIAL", employee: user.employee, cred: credentials[user.employee] });
  showToast("Password aggiornata con successo!", "ok");
  renderHome();
}

function revenueView() {
  const now = new Date(), startWeek = new Date(now);
  startWeek.setHours(0, 0, 0, 0);
  const day = (startWeek.getDay() + 6) % 7;
  startWeek.setDate(startWeek.getDate() - day);
  const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now); end.setHours(23, 59, 59, 999);
  const incassato = o => o.payment === "subito" ? (o.paid ? o.total : 0) : 0;
  const inPeriod = (o, start) => { const d = new Date(o.paidAt || o.date); return d >= start && d <= end; };
  const week = orders.filter(o => inPeriod(o, startWeek));
  const month = orders.filter(o => inPeriod(o, startMonth));
  const sum = a => a.reduce((s, o) => s + incassato(o), 0);
  const count = a => a.filter(o => incassato(o) > 0).length;

  shell("Incassi Spaccio", `
    <div class="stat-box">
      <div>
        <div class="muted" style="font-weight:700">Settimana Corrente (${count(week)} ordini)</div>
        <div class="stat-value">${euro(sum(week))}</div>
      </div>
    </div>
    <div class="stat-box">
      <div>
        <div class="muted" style="font-weight:700">Mese Corrente (${count(month)} ordini)</div>
        <div class="stat-value">${euro(sum(month))}</div>
      </div>
    </div>
  `);
}

let tempRoleChoice = "consumer";
function openManageAccessModal(empName) {
  ensureAllEmployeeAccounts();
  const cred = credentials[empName] || [makeNomeCognomeUsername(empName), DEFAULT_EMP_HASH];
  const curUsername = cred[0];
  tempRoleChoice = employeeRoles[empName] || "consumer";
  const modal = document.getElementById("customModal");

  function renderAccessModal(keepUname = curUsername, keepPwd = "") {
    modal.innerHTML = `<div class="modal-box">
      <h3 style="margin-bottom:4px">🔑 Accesso & Privilegi</h3>
      <p class="muted" style="margin:0 0 14px 0"><b>${esc(empName)}</b></p>

      <label>Username di accesso (nome.cognome)</label>
      <input id="editEmpUsername" value="${esc(keepUname)}" placeholder="nome.cognome" style="font-family:monospace;margin-bottom:12px">

      <label>Nuova Password (lascia vuoto per non cambiarla)</label>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <input id="editEmpPassword" type="text" value="${esc(keepPwd)}" placeholder="Es. 1234" style="margin:0;flex:1">
        <button type="button" class="secondary" style="white-space:nowrap" onclick="document.getElementById('editEmpPassword').value='1234'">Reset 1234</button>
      </div>

      <label>Livello di Privilegi</label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
        <button type="button" class="type-btn ${tempRoleChoice === 'consumer' ? 'active' : ''}" style="justify-content:flex-start;text-align:left;padding:12px 14px;min-height:58px" onclick="setTempEmpRole('consumer')">
          <div>
            <div style="font-weight:800">👤 Solo Consumatore (Standard)</div>
            <div style="font-size:0.8rem;opacity:0.85;font-weight:500">Vede solo il proprio saldo, i propri ordini e cambia password</div>
          </div>
        </button>
        <button type="button" class="type-btn ${tempRoleChoice === 'cashier' ? 'active' : ''}" style="justify-content:flex-start;text-align:left;padding:12px 14px;min-height:58px" onclick="setTempEmpRole('cashier')">
          <div>
            <div style="font-weight:800">☕ Cassiere POS + Conto Personale</div>
            <div style="font-size:0.8rem;opacity:0.85;font-weight:500">Può stare al tablet in cassa, registrare ordini, versamenti e addebiti</div>
          </div>
        </button>
        <button type="button" class="type-btn ${tempRoleChoice === 'admin' ? 'active' : ''}" style="justify-content:flex-start;text-align:left;padding:12px 14px;min-height:58px" onclick="setTempEmpRole('admin')">
          <div>
            <div style="font-weight:800">🛡️ Amministratore + Cassiere POS</div>
            <div style="font-size:0.8rem;opacity:0.85;font-weight:500">Accesso completo (richiede anche password Admin)</div>
          </div>
        </button>
      </div>

      <div class="modal-actions">
        <button type="button" class="secondary" onclick="document.getElementById('customModal').classList.add('hidden')">ANNULLA</button>
        <button type="button" class="ok-btn" onclick="saveEmployeeAccess(${JSON.stringify(empName)})">SALVA MODIFICHE</button>
      </div>
    </div>`;
  }

  window.setTempEmpRole = (r) => {
    const uVal = document.getElementById("editEmpUsername")?.value || curUsername;
    const pVal = document.getElementById("editEmpPassword")?.value || "";
    tempRoleChoice = r;
    renderAccessModal(uVal, pVal);
  };

  window.saveEmployeeAccess = async (targetName) => {
    const newUname = (document.getElementById("editEmpUsername")?.value || "").trim().toLowerCase();
    const newPwd = (document.getElementById("editEmpPassword")?.value || "").trim();

    if (!newUname || newUname.length < 3) {
      showToast("Inserisci uno username valido (minimo 3 caratteri).", "err");
      return;
    }
    if (newUname === "admin") {
      showToast("Lo username 'admin' è riservato al sistema.", "err");
      return;
    }
    // Check uniqueness across other employees
    const conflict = Object.entries(credentials).find(([emp, [u]]) => emp !== targetName && u.toLowerCase() === newUname);
    if (conflict) {
      showToast(`Username già assegnato a ${conflict[0]}.`, "err");
      return;
    }
    if (newPwd && newPwd.length < 4) {
      showToast("La password deve avere almeno 4 caratteri.", "err");
      return;
    }

    const oldHash = credentials[targetName]?.[1] || DEFAULT_EMP_HASH;
    const finalHash = newPwd ? await sha256(newPwd) : oldHash;
    credentials[targetName] = [newUname, finalHash];
    employeeRoles[targetName] = tempRoleChoice;

    if (user && user.employee === targetName) {
      user.username = newUname;
      saveSession();
    }

    rebuildAccounts();
    enqueueAtomicOp({ type: "UPDATE_CREDENTIAL", employee: targetName, cred: credentials[targetName], roleLevel: tempRoleChoice });
    modal.classList.add("hidden");
    showToast(`Credenziali e ruolo aggiornati per ${targetName}!`, "ok");
    adminEmployeesView();
  };

  modal.classList.remove("hidden");
  renderAccessModal();
}

function saveEmployeeByName(oldName, i) {
  const name = document.getElementById("empName_" + i)?.value.trim();
  if (!name) { showToast("Inserisci un nome valido.", "err"); return; }
  if (name !== oldName && employees.some(n => n.toLowerCase() === name.toLowerCase())) {
    showToast("Nome già presente.", "err"); return;
  }
  const idx = employees.indexOf(oldName);
  if (idx < 0) return;
  employees[idx] = name;
  employees.sort((a, b) => a.localeCompare(b, "it", { sensitivity: "base" }));
  if (oldName !== name) {
    balances[name] = balances[oldName] || 0;
    delete balances[oldName];
    if (credentials[oldName]) {
      credentials[name] = credentials[oldName];
      delete credentials[oldName];
    }
    if (employeeRoles[oldName]) {
      employeeRoles[name] = employeeRoles[oldName];
      delete employeeRoles[oldName];
    }
  }
  ensureAllEmployeeAccounts();
  rebuildAccounts();
  enqueueAtomicOp({ type: "RENAME_EMPLOYEE", oldName, newName: name });
  showToast("Nominativo aggiornato!", "ok");
  adminEmployeesView();
}

function addEmployee() {
  showPromptModal("Nuovo Dipendente", "Cognome e Nome (es. Rossi Mario)", false, (raw) => {
    const n = (raw || "").trim();
    if (!n) return;
    if (employees.some(x => x.toLowerCase() === n.toLowerCase())) {
      showToast("Dipendente già in elenco.", "err"); return;
    }
    employees.push(n);
    employees.sort((a, b) => a.localeCompare(b, "it", { sensitivity: "base" }));
    balances[n] = 0;
    employeeRoles[n] = "consumer";
    ensureAllEmployeeAccounts();
    rebuildAccounts();
    enqueueAtomicOp({ type: "ADD_EMPLOYEE", name: n, cred: credentials[n], roleLevel: "consumer" });
    const generatedUname = credentials[n]?.[0] || makeNomeCognomeUsername(n);
    showToast(`${n} aggiunto! Login: ${generatedUname} / 1234`, "ok");
    adminEmployeesView();
  });
}

function removeEmployee(name, source = "employees") {
  showConfirmModal("Rimuovi Dipendente", `Eliminare definitivamente ${name}, le sue credenziali e il relativo saldo?`, () => {
    employees = employees.filter(n => n !== name).sort((a, b) => a.localeCompare(b, "it", { sensitivity: "base" }));
    delete balances[name];
    delete credentials[name];
    delete employeeRoles[name];
    rebuildAccounts();
    enqueueAtomicOp({ type: "REMOVE_EMPLOYEE", name });
    showToast(`${name} rimosso.`, "info");
    if (source === "adminBalance") adminEmployeeBalancesView();
    else adminEmployeesView();
  }, true);
}

function clearHistory() {
  if (!orders.length && !balanceMovements.length && !mealMovements.length) {
    showToast("Il registro è già vuoto.", "info");
    return;
  }
  showConfirmModal("Azzera Registro e Storico", "Cancellare tutto lo storico di ordini, versamenti e addebiti? I saldi attuali dei dipendenti non verranno toccati.", () => {
    orders = [];
    balanceMovements = [];
    mealMovements = [];
    enqueueAtomicOp({ type: "CLEAR_HISTORY" });

}

function openMealQuotaNumpad() {
  openNumpadModal(
    "Quota Pasto",
    "Inserisci la quota per singolo partecipante",
    String(mealQuotaVal),
    [{ label: "5 €", val: "5" }, { label: "10 €", val: "10" }, { label: "15 €", val: "15" }],
    "var(--primary)",
    (val) => {
      if (!Number.isFinite(val) || val <= 0) { showToast("Inserisci un importo valido.", "err"); return; }
      mealQuotaVal = val;
      const disp = document.getElementById("mealQuotaDisplay");
      if (disp) disp.textContent = euro(mealQuotaVal);

function confirmMealTurno() {
  const selected = [...document.querySelectorAll(".mealEmployeeCheck:checked")].map(x => x.value);
  const amount = Number(mealQuotaVal || 0);
  if (!selected.length) { showToast("Seleziona almeno un dipendente.", "err"); return; }
  if (!Number.isFinite(amount) || amount <= 0) { showToast("Inserisci un importo valido.", "err"); return; }
  const total = selected.length * amount;

  showConfirmModal("Conferma Addebito", `Addebitare ${euro(amount)} a ${selected.length} dipendenti (Totale: ${euro(total)})?`, () => {
    const now = new Date().toISOString();
    const entries = [];
    selected.forEach(name => {
      balances[name] = (balances[name] || 0) - amount;
      const ent = {
        id: Date.now() + Math.random(),
        date: now,
        employee: name,
        amount,
        type: "Pranzo/Cena con il turno",
        by: formatOperatorAudit(user),
        byUsername: user?.username || "—",
        byRole: role || "Amministratore"
      };
      mealMovements.push(ent);
      entries.push(ent);
    });
    enqueueAtomicOp({ type: "MEAL_DEBIT", date: now, entries });
    showToast(`Addebitati ${euro(total)} a ${selected.length} dipendenti!`, "ok");
    renderHome();
  });
}

function adminStockView() {
  const rows = stockItems.map((n, i) => `
    <div class="bar-order" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <b style="font-size:1.05rem">${esc(n)}</b>
      <div class="qty-controls">
        <button type="button" class="secondary qty-btn" onclick="stepStock(${i}, -1)">−</button>
        <span id="stockVal_${i}" style="font-weight:900;font-size:1.2rem;min-width:44px;text-align:center">${Number(stock[n] || 0)}</span>
        <button type="button" class="secondary qty-btn" onclick="stepStock(${i}, 1)">+</button>
      </div>
    </div>`).join("");

  shell("Giacenze Magazzino", `
    <div class="card">
      <h3>Inventario Spaccio</h3>
      ${rows}
      <button class="big" style="margin-top:8px" onclick="saveStock()">SALVA GIACENZE</button>
    </div>
  `);
}

function stepStock(i, delta) {
  const n = stockItems[i];
  stock[n] = Math.max(0, Number(stock[n] || 0) + delta);
  const el = document.getElementById("stockVal_" + i);
  if (el) el.textContent = stock[n];
}

function saveStock() {
  enqueueAtomicOp({ type: "SET_STOCK", stock: { ...stock } });
  showToast("Giacenze aggiornate!", "ok");
  renderHome();
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { initializeFirestore, persistentLocalCache, doc, getDoc, setDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxPFBq-YKSu-je6RBRqudyei7-EsjWm4Y",
  authDomain: "spaccio-turno-a.firebaseapp.com",
  projectId: "spaccio-turno-a",
  storageBucket: "spaccio-turno-a.firebasestorage.app",
  messagingSenderId: "43990223549",
  appId: "1:43990223549:web:1b5c14b90178451da645d4"
};

const statusEl = document.getElementById("cloudStatus");
function setStatus(state, label) {
  if (!statusEl) return;
  if (state === "ok" || state === true) {
    statusEl.textContent = "🟢 " + (label || "Sincronizzato");
    statusEl.style.color = "#166534";
    statusEl.style.background = "#dcfce7";
  } else if (state === "saving") {
    statusEl.textContent = "🟡 " + (label || "Salvataggio...");
    statusEl.style.color = "#854d0e";
    statusEl.style.background = "#fef9c3";
  } else {
    statusEl.textContent = "🔴 " + (label || "Offline (in coda)");
    statusEl.style.color = "#b91c1c";
    statusEl.style.background = "#fee2e2";
  }
}
window.setCloudBadge = setStatus;
window.isApplyingRemoteData = false;

try {
  const app = initializeApp(firebaseConfig);
  const db = initializeFirestore(app, { localCache: persistentLocalCache() });
  const dataRef = doc(db, "gestionale", "dati_spaccio");

  // Full snapshot overwrite (used only for explicit JSON import or initial seed)
  window.firebaseSaveFullSnapshot = async (data) => {
    await setDoc(dataRef, { ...data, updatedAt: new Date().toISOString() });
    if (navigator.onLine) setStatus("ok", "Sincronizzato");
    else setStatus("err", "Offline (in coda)");
  };

  // Conflict-free atomic transaction: reads latest cloud state, applies queued operations cleanly, retries automatically on concurrent writes
  window.firebaseRunAtomicBatch = async (opsBatch) => {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(dataRef);
      let baseState = snap.exists() ? snap.data() : window.spaccioCollectAllData();
      opsBatch.forEach(op => {
        baseState = window.spaccioApplyAtomicOpToState(baseState, op);
      });
      tx.set(dataRef, { ...baseState, updatedAt: new Date().toISOString() });
    });
  };

  window.addEventListener("online", () => {
    setStatus("ok", "Sincronizzato");
    if (window.flushAtomicOps) window.flushAtomicOps();
  });
  window.addEventListener("offline", () => setStatus("err", "Offline (in coda)"));

  const initial = await getDoc(dataRef);
  if (!initial.exists()) {
    await setDoc(dataRef, { ...window.spaccioCollectAllData(), updatedAt: new Date().toISOString() });
    setStatus("ok", "Sincronizzato");
  } else if (window.flushAtomicOps) {
    window.flushAtomicOps();
  }

  onSnapshot(dataRef, (snap) => {
    if (!snap.exists()) return;
    const remote = snap.data();
    if (window.isApplyingRemoteData) return;
    window.isApplyingRemoteData = true;
    try {
      const { updatedAt, ...payload } = remote;
      window.spaccioApplyAllData(payload);
      setStatus(navigator.onLine ? "ok" : "err", navigator.onLine ? "Sincronizzato" : "Offline (in coda)");
    } catch (err) {
      console.error("Errore dati Firestore:", err);
      setStatus("err", "Errore dati");
    } finally {
      window.isApplyingRemoteData = false;
    }
  }, (error) => {
    console.error("Firestore onSnapshot:", error);
    setStatus("err", "Offline / errore");
  });
} catch (error) {
  console.error("Init Firebase:", error);
  setStatus("err", "Offline");
}
</script>
